name = "aurastream-backend"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "aurastream-db"
database_id = "df043532-d6fb-49e9-be9e-3c141e04131a"

[vars]
NODE_ENV = "production"
CLIENT_URL = "https://aurastream.netlify.app"
JWT_ACCESS_EXPIRATION = "15m"
JWT_REFRESH_EXPIRATION = "7d"
